<!doctype html>
<!--
  `lang="pt-BR"` + `translate="no"` + `notranslate`: o Google Tradutor do Chrome reescreve os nós de
  texto do DOM e o React quebra ao reconciliar ("Failed to execute 'insertBefore' on 'Node'") —
  chamado .docs/chamados/2026-11-24-tradutor-chrome-quebra-react.md. Não remova.
-->
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICOS — Secretaria de Saúde</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
